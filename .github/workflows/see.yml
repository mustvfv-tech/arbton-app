name: Update see.tg floors
on:
  schedule:
    - cron: "7 */3 * * *"   # المجموعات: 8 طلبات في اليوم
    - cron: "40 3 * * *"    # النماذج: مرة في اليوم (حتى 14 طلب)
  workflow_dispatch:
    inputs:
      mode:
        description: "cols or models"
        default: "cols"
permissions:
  contents: write
concurrency:
  group: arbton-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/data-restore.sh
      - name: Fetch see.tg
        env:
          SEE_TOKEN: ${{ secrets.SEE_TOKEN }}
          OUT_DIR: _out
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '40 3 * * *' && 'models' || 'cols') }}
        run: node scripts/see-floors.mjs
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/data-publish.sh
