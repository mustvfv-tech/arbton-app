name: Update stickers
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arbton-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/data-restore.sh
      - name: Fetch stickers
        env:
          OPENSEA_KEY: ${{ secrets.OPENSEA_KEY }}
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          OUT_DIR: _out
        run: node scripts/stickers.mjs
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/data-publish.sh
