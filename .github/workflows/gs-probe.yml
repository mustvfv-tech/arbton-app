name: GS probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gs-probe.mjs
        env:
          GS_TOKEN: ${{ secrets.GS_TOKEN }}
          GS_BASE: ${{ vars.GS_BASE }}
